# The platform's own CI gate (see the first course's Lesson 6): lint, typecheck,
# validate the content files, make sure the agent compiles and the site builds.
# No API key is needed. Evals (npm run eve:eval) need AI Gateway credentials, so
# they are run by hand or against a deployment: npx eve eval --url <deployment>.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content:bundle -- --check
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npx eve build --skip-sandbox-prewarm
      - run: npm run build
